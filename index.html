<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Marcador de Coleiro</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050505;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

h1 {
  margin: 5px 0 20px;
  font-size: 28px;
}

.tempo-opcoes {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tempo-btn {
  flex: 1;
  padding: 14px;
  border: 2px solid #444;
  border-radius: 12px;
  background: #171717;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.tempo-btn.ativo {
  border-color: #ff3030;
  background: #321010;
}

#cronometro {
  font-size: 58px;
  font-weight: bold;
  margin: 15px 0;
  font-variant-numeric: tabular-nums;
}

#botaoCanto {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 8px solid #ff5656;
  background: #d50000;
  color: white;
  font-size: 38px;
  font-weight: bold;
  margin: 10px auto 20px;
  display: block;
  box-shadow: 0 0 25px rgba(255,0,0,.35);
  touch-action: manipulation;
}

#botaoCanto:active {
  transform: scale(.96);
  background: #ff1b1b;
}

.painel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.card {
  background: #151515;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 14px 8px;
}

.card-titulo {
  color: #aaa;
  font-size: 14px;
}

.numero {
  font-size: 36px;
  font-weight: bold;
  margin-top: 4px;
}

#projecao {
  color: #ffd54a;
}

.controles {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.controles button {
  flex: 1;
  padding: 15px 5px;
  border: 0;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
}

#iniciar {
  background: #19a54a;
  color: white;
}

#zerar {
  background: #333;
  color: white;
}

.resumo {
  margin-top: 22px;
  background: #111;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 15px;
  text-align: left;
}

.resumo h2 {
  font-size: 19px;
  text-align: center;
  margin: 0 0 12px;
}

.linha-minuto {
  display: flex;
  justify-content: space-between;
  padding: 9px 5px;
  border-bottom: 1px solid #292929;
  font-size: 17px;
}

.sem-dados {
  text-align: center;
  color: #777;
  padding: 10px;
}
</style>
</head>

<body>

<div class="container">

  <h1>🐦 MARCADOR DE COLEIRO</h1>

  <div class="tempo-opcoes">
    <button id="btn10" class="tempo-btn ativo" onclick="selecionarTempo(10)">
      10 MIN
    </button>

    <button id="btn15" class="tempo-btn" onclick="selecionarTempo(15)">
      15 MIN
    </button>
  </div>

  <div id="cronometro">10:00</div>

  <button id="botaoCanto" onclick="registrarCanto()">
    CANTO
  </button>

  <div class="painel">

    <div class="card">
      <div class="card-titulo">TOTAL DE CANTOS</div>
      <div id="total" class="numero">0</div>
    </div>

    <div class="card">
      <div class="card-titulo">RESULTADO FUTURO</div>
      <div id="projecao" class="numero">0</div>
    </div>

  </div>

  <div class="controles">
    <button id="iniciar" onclick="iniciarPausar()">
      ▶ INICIAR
    </button>

    <button id="zerar" onclick="zerarTudo()">
      ↻ ZERAR
    </button>
  </div>

  <div class="resumo">
    <h2>📊 CANTOS POR MINUTO</h2>

    <div id="listaMinutos">
      <div class="sem-dados">
        Aguardando início da marcação
      </div>
    </div>
  </div>

</div>

<script>

let minutosProva = 10;
let segundosRestantes = 600;
let totalCantos = 0;

let rodando = false;
let intervalo = null;

let cantosPorMinuto = [];
let minutoAtual = 0;
let cantosMinutoAtual = 0;


// ESCOLHER 10 OU 15 MINUTOS

function selecionarTempo(minutos) {

  if (rodando) return;

  minutosProva = minutos;

  zerarTudo();

  document.getElementById("btn10")
    .classList.toggle("ativo", minutos === 10);

  document.getElementById("btn15")
    .classList.toggle("ativo", minutos === 15);
}


// INICIAR / PAUSAR

function iniciarPausar() {

  if (segundosRestantes <= 0) return;

  if (!rodando) {

    rodando = true;

    document.getElementById("iniciar").textContent =
      "⏸ PAUSAR";

    intervalo = setInterval(tick, 1000);

  } else {

    pausar();

  }
}


// PAUSAR

function pausar() {

  rodando = false;

  clearInterval(intervalo);

  intervalo = null;

  document.getElementById("iniciar").textContent =
    "▶ CONTINUAR";
}


// CRONÔMETRO

function tick() {

  if (segundosRestantes <= 0) {
    finalizar();
    return;
  }

  segundosRestantes--;

  atualizarTela();

  verificarMinuto();

  if (segundosRestantes <= 0) {
    finalizar();
  }
}


// REGISTRAR CANTO

function registrarCanto() {

  // Só registra depois que a prova começar
  if (!rodando) return;

  totalCantos++;

  cantosMinutoAtual++;

  atualizarTela();
}


// VERIFICA QUANDO COMPLETA CADA MINUTO

function verificarMinuto() {

  const totalSegundos = minutosProva * 60;

  const segundosDecorridos =
    totalSegundos - segundosRestantes;

  const novoMinuto =
    Math.floor(segundosDecorridos / 60);

  if (novoMinuto > minutoAtual) {

    cantosPorMinuto.push(cantosMinutoAtual);

    cantosMinutoAtual = 0;

    minutoAtual = novoMinuto;

    atualizarLista();
  }
}


// RESULTADO FUTURO

function calcularProjecao() {

  const totalSegundos = minutosProva * 60;

  const segundosDecorridos =
    totalSegundos - segundosRestantes;

  if (segundosDecorridos <= 0) {
    return 0;
  }

  return Math.round(
    (totalCantos / segundosDecorridos) *
    totalSegundos
  );
}


// ATUALIZAR TELA

function atualizarTela() {

  const min =
    Math.floor(segundosRestantes / 60);

  const seg =
    segundosRestantes % 60;

  document.getElementById("cronometro").textContent =
    String(min).padStart(2, "0") +
    ":" +
    String(seg).padStart(2, "0");

  document.getElementById("total").textContent =
    totalCantos;

  document.getElementById("projecao").textContent =
    calcularProjecao();
}


// LISTA DE CANTOS POR MINUTO

function atualizarLista() {

  const lista =
    document.getElementById("listaMinutos");

  if (cantosPorMinuto.length === 0) {

    lista.innerHTML =
      '<div class="sem-dados">' +
      'Aguardando o primeiro minuto' +
      '</div>';

    return;
  }

  lista.innerHTML = "";

  cantosPorMinuto.forEach(function(cantos, indice) {

    const linha =
      document.createElement("div");

    linha.className = "linha-minuto";

    linha.innerHTML =
      "<span>" +
      (indice + 1) +
      "º minuto</span>" +
      "<strong>" +
      cantos +
      " cantos</strong>";

    lista.appendChild(linha);
  });
}


// FINALIZAR

function finalizar() {

  clearInterval(intervalo);

  intervalo = null;
  rodando = false;

  // Guarda o último minuto caso necessário
  if (minutoAtual < minutosProva) {

    cantosPorMinuto.push(cantosMinutoAtual);

    minutoAtual++;

    atualizarLista();
  }

  segundosRestantes = 0;

  atualizarTela();

  document.getElementById("iniciar").textContent =
    "✓ FINALIZADO";
}


// ZERAR

function zerarTudo() {

  clearInterval(intervalo);

  intervalo = null;

  rodando = false;

  segundosRestantes =
    minutosProva * 60;

  totalCantos = 0;

  cantosPorMinuto = [];

  minutoAtual = 0;

  cantosMinutoAtual = 0;

  document.getElementById("iniciar").textContent =
    "▶ INICIAR";

  document.getElementById("listaMinutos").innerHTML =
    '<div class="sem-dados">' +
    'Aguardando início da marcação' +
    '</div>';

  atualizarTela();
}


// PRIMEIRA EXIBIÇÃO

atualizarTela();

</script>

</body>
</html>

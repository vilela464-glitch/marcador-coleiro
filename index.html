<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Marcador de Coleiro 2.0</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;background:#07111f;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 text-align:center;padding:18px;
}
h1{margin:5px 0;font-size:26px}
.sub{color:#91a4bb;margin-bottom:15px}
.tempos{display:flex;gap:8px;justify-content:center}
button{
 border:0;border-radius:14px;
 font-weight:700;cursor:pointer
}
.tempos button{
 padding:11px 20px;background:#132238;
 color:#fff;font-size:16px
}
.tempos .ativo{background:#1677ff}

#tempo{
 font-size:64px;font-weight:800;
 letter-spacing:2px;margin:16px 0 4px
}
.status{color:#8fa4bb;margin-bottom:14px}

.painel{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;margin-bottom:12px
}
.card{
 background:#101d2d;border:1px solid #20334b;
 border-radius:18px;padding:14px
}
.numero{
 font-size:44px;font-weight:900;
 margin:5px 0
}
.label{color:#8fa4bb;font-size:14px}

.canto{
 width:100%;
 height:170px;
 padding:20px;
 background:#16a34a;
 color:white;
 font-size:38px;
 font-weight:900;
 margin:12px 0;
 border-radius:24px;
 box-shadow:0 5px 20px #0005;
 touch-action:manipulation;
}
.canto:active{transform:scale(.98)}

.info{
 background:#101d2d;border-radius:18px;
 padding:14px;margin-top:10px
}
.projecao{
 font-size:36px;font-weight:900;
 color:#38bdf8;margin:5px
}
.ritmo{
 color:#a7f3d0;font-weight:700
}

.acoes{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;margin-top:12px
}
.iniciar{padding:16px;background:#1677ff;color:#fff;font-size:18px}
.reset{padding:16px;background:#ef4444;color:#fff;font-size:18px}

.historico{
 margin-top:15px;text-align:left;
 background:#101d2d;padding:15px;
 border-radius:18px
}
.historico h3{margin:0 0 8px}
#lista{color:#b9c7d8;font-size:14px;line-height:1.6}

small{display:block;color:#60758d;margin-top:15px}
</style>
</head>

<body>

<h1>🐦 Marcador de Coleiro 2.0</h1>
<div class="sub">Contagem • Ritmo • Projeção automática</div>

<div class="tempos">
 <button onclick="definirTempo(600,this)" class="ativo">10 min</button>
 <button onclick="definirTempo(900,this)">15 min</button>
</div>

<div id="tempo">10:00</div>
<div class="status" id="status">Pronto para iniciar</div>

<div class="painel">
 <div class="card">
  <div class="label">CANTOS</div>
  <div class="numero" id="cantos">0</div>
 </div>

 <div class="card">
  <div class="label">CANTOS/MIN</div>
  <div class="numero" id="media">0.0</div>
 </div>
</div>

<button class="canto" onclick="marcarCanto()">+ 1 CANTO</button>

<div class="info">
 <div class="label">PROJEÇÃO PARA O FINAL</div>
 <div class="projecao" id="projecao">0</div>
 <div class="ritmo" id="ritmo">Aguardando cantos...</div>
</div>

<div class="acoes">
 <button class="iniciar" id="iniciar" onclick="iniciar()">▶ INICIAR</button>
 <button class="reset" onclick="resetar()">↻ ZERAR</button>
</div>

<div class="historico">
 <h3>Últimos cantos</h3>
 <div id="lista">Nenhum canto marcado.</div>
</div>

<small>Marcador de Coleiro • Versão 2.0</small>

<script>
let duracao=600;
let restante=600;
let cantos=0;
let rodando=false;
let inicio=null;
let timer=null;
let marcas=[];

function definirTempo(seg,botao){
 if(rodando)return;
 duracao=seg;
 restante=seg;

 document.querySelectorAll(".tempos button")
 .forEach(b=>b.classList.remove("ativo"));

 botao.classList.add("ativo");
 atualizarTempo();
 atualizarDados();
}

function atualizarTempo(){
 let m=Math.floor(restante/60);
 let s=restante%60;

 document.getElementById("tempo").textContent=
 String(m).padStart(2,"0")+":"+
 String(s).padStart(2,"0");
}

function iniciar(){
 if(rodando){
  rodando=false;
  clearInterval(timer);
  document.getElementById("status").textContent="Pausado";
  document.getElementById("iniciar").textContent="▶ CONTINUAR";
  return;
 }

 if(restante<=0)return;

 rodando=true;

 if(!inicio)
  inicio=Date.now()-(duracao-restante)*1000;

 document.getElementById("status").textContent="Marcação em andamento";
 document.getElementById("iniciar").textContent="⏸ PAUSAR";

 timer=setInterval(()=>{
  restante--;

  if(restante<=0){
   restante=0;
   rodando=false;
   clearInterval(timer);
   document.getElementById("status").textContent="TEMPO ENCERRADO";
   document.getElementById("iniciar").textContent="FINALIZADO";
  }

  atualizarTempo();
  atualizarDados();
 },1000);
}

function marcarCanto(){
 if(!rodando)return;

 cantos++;
 marcas.unshift(duracao-restante);

 if(navigator.vibrate)
  navigator.vibrate(30);

 atualizarDados();
 atualizarHistorico();
}

function atualizarDados(){
 document.getElementById("cantos").textContent=cantos;

 let decorrido=duracao-restante;

 if(decorrido>0){
  let media=cantos/(decorrido/60);
  let proj=Math.round(media*(duracao/60));

  document.getElementById("media").textContent=media.toFixed(1);
  document.getElementById("projecao").textContent=proj;

  if(media>=15)
   document.getElementById("ritmo").textContent="🔥 Ritmo muito forte";
  else if(media>=10)
   document.getElementById("ritmo").textContent="⚡ Ritmo forte";
  else if(media>=5)
   document.getElementById("ritmo").textContent="✓ Ritmo regular";
  else
   document.getElementById("ritmo").textContent="Ritmo baixo";
 }else{
  document.getElementById("media").textContent="0.0";
  document.getElementById("projecao").textContent="0";
 }
}

function atualizarHistorico(){
 let lista=document.getElementById("lista");

 if(!marcas.length){
  lista.textContent="Nenhum canto marcado.";
  return;
 }

 lista.innerHTML=marcas.slice(0,8).map((t,i)=>{
  let m=Math.floor(t/60);
  let s=t%60;

  return "#"+(cantos-i)+" — "+
  String(m).padStart(2,"0")+":"+
  String(s).padStart(2,"0");
 }).join("<br>");
}

function resetar(){
 clearInterval(timer);

 rodando=false;
 restante=duracao;
 cantos=0;
 inicio=null;
 marcas=[];

 document.getElementById("status").textContent="Pronto para iniciar";
 document.getElementById("iniciar").textContent="▶ INICIAR";
 document.getElementById("ritmo").textContent="Aguardando cantos...";
 document.getElementById("lista").textContent="Nenhum canto marcado.";

 atualizarTempo();
 atualizarDados();
}

atualizarTempo();
</script>

</body>
</html>
